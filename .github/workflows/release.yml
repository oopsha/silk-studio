# Build signed updater artifacts and publish GitHub Releases.
# Trigger: push tags like v0.1.0
#
# Required secrets (minimum):
#   TAURI_SIGNING_PRIVATE_KEY
# Optional: TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#
# Optional OS signing / notarize (slots — wire when certificates are ready):
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
#   WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD
#
# See docs/release.md

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version from package.json#packageManager (pnpm@11)

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Setup Java (jdbc-agent)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build jdbc-agent
        working-directory: packages/jdbc-agent
        run: ./gradlew build --quiet
        shell: bash

      - name: Stage bundled runtime (JRE + agent)
        run: node scripts/prepare-runtime-resources.mjs

      - name: Import Apple certificate (optional)
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "Apple certificate secret present — follow docs/release.md to enable codesign/notarize in this job when ready."
        continue-on-error: true

      - name: Build and upload (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # OS signing slots: intentionally omitted while unset. tauri-action treats a
          # present-but-empty APPLE_CERTIFICATE as "configured" and attempts to import it,
          # which fails keychain import outright. Re-add these once real secrets exist
          # (see docs/release.md for the certificate/notarize secret list).
        with:
          projectPath: apps/silk-db-studio
          tagName: ${{ github.ref_name }}
          releaseName: Silk DB Studio ${{ github.ref_name }}
          releaseBody: |
            ## Silk DB Studio ${{ github.ref_name }}

            Installers include **jdbc-agent** and a **bundled Temurin JRE 17**.

            In-app updates: Manage → **Check for Updates…**
            (feed: `latest.json` on this release).

            See `docs/release.md` for signing / notarize notes.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
