[package]
name = "ssm-tunnel-client"
version = "0.1.0"
description = "AWS SSO login + SSM Session Manager API client for the Silk connection tunnel"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
hmac = "0.12"
sysinfo = "0.32"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
