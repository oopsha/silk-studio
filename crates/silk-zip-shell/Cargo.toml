[package]
name = "silk-zip-shell"
version = "0.1.0"
description = "Silk Zip Explorer context menu extension"
authors = ["oopsha"]
edition = "2021"

[lib]
name = "silk_zip_shell"
crate-type = ["cdylib", "rlib"]

[dependencies]
silk-zip-menu = { path = "../silk-zip-menu" }

[target.'cfg(windows)'.dependencies]
windows-core = "0.61"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }
