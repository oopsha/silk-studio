[package]
name = "silk-zip"
version = "0.1.0"
description = "Silk Zip"
authors = ["oopsha"]
edition = "2021"

[lib]
name = "silk_zip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-core = "0.61"
silk-zip-menu = { path = "../../../crates/silk-zip-menu" }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_DataExchange", "Win32_System_Memory"] }

[dependencies]
silk-archive = { path = "../../../crates/silk-archive" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-window-controls = "0.1"
silk-window-state = { path = "../../../crates/silk-window-state" }
