[package]
name = "silk-zip"
version = "0.1.0"
description = "Silk Zip"
authors = ["oopsha"]
edition = "2021"

[lib]
name = "silk_zip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
silk-archive = { path = "../../../crates/silk-archive" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-controls = "0.1"
silk-window-state = { path = "../../../crates/silk-window-state" }
