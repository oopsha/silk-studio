[[permission]]
identifier = "allow-connection-commands"
description = "Allows JDBC connection management through jdbc-agent."
commands.allow = [
  "connection_connect",
  "connection_disconnect",
  "connection_test",
  "connection_metadata",
  "connection_columns",
  "connection_package_members",
  "connection_primary_keys",
  "connection_ddl",
  "connection_compile",
  "connection_rollback",
  "connection_set_catalog",
]
