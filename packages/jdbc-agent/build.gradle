plugins {
  id 'application'
}

repositories {
  mavenCentral()
}

dependencies {
  implementation 'com.oracle.database.jdbc:ojdbc11:23.4.0.24.05'
  // ORA-17056 방지: KO16MSWIN949 등 EUC/MSWIN 계열 문자집합 지원 (orai18n)
  implementation 'com.oracle.database.nls:orai18n:23.4.0.24.05'
  // Official Microsoft JDBC Driver for SQL Server. The jre11 classifier's Windows
  // Integrated Auth / Entra ID extras (azure-identity, bcprov, antlr4-runtime, gson) are
  // declared `optional`/`provided` upstream, so `implementation` does NOT pull them in —
  // this stays scoped to SQL authentication only, matching the multi-jdbc-rollout plan.
  implementation 'com.microsoft.sqlserver:mssql-jdbc:13.4.0.jre11'
  // Official MySQL Connector/J. Licensed GPLv2 + Universal FOSS Exception 1.0 (unlike the
  // Oracle/Microsoft drivers above) — see THIRD_PARTY_NOTICES.md before changing how this
  // jar is bundled/distributed. Pulls in protobuf-java (mandatory, used by the driver); the
  // optional OCI SDK integration is NOT pulled in by `implementation`.
  implementation 'com.mysql:mysql-connector-j:9.7.0'
  // Official MariaDB Connector/J. Licensed LGPL-2.1-or-later — see THIRD_PARTY_NOTICES.md.
  // Separate driver/artifact from mysql-connector-j above (own "mariadb" driver id in the
  // frontend); its slf4j-api/bouncycastle/OSGi/AWS-RDS/waffle-jna extras are all declared
  // `optional`/`provided` upstream, so `implementation` pulls in no extra runtime jars. By
  // default (no `permitMysqlScheme` option) it only claims `jdbc:mariadb:` URLs, so it can't
  // shadow mysql-connector-j's `jdbc:mysql:` prefix on the same classpath.
  implementation 'org.mariadb.jdbc:mariadb-java-client:3.5.9'
  // Official PostgreSQL JDBC Driver (pgJDBC). Licensed BSD-2-Clause — see
  // THIRD_PARTY_NOTICES.md. Pure Type-4 driver; pulls in checker-qual (annotations) as a
  // compile/runtime dependency. Claims `jdbc:postgresql:` only.
  implementation 'org.postgresql:postgresql:42.7.13'
  implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
}

application {
  mainClass = 'com.silk.jdbcagent.Main'
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(17)
  }
}

// Oracle's ojdbc11.jar is a *sealed* jar (see its META-INF/MANIFEST.MF), which means the
// JVM enforces that every class in its packages must come from that exact jar file.
// Naively merging its .class files into a single uber-jar together with orai18n.jar (via
// zipTree + DuplicatesStrategy.EXCLUDE) is fragile and has caused sporadic
// `NoClassDefFoundError`s at runtime (e.g. oracle/jdbc/driver/RowidBinder going missing)
// because sealing / duplicate-entry handling doesn't play well with class merging.
//
// Instead we ship a *thin* runnable jar (just our own classes) plus a `lib/` folder with
// the untouched dependency jars next to it, wired together via the manifest's Class-Path
// attribute. `java -jar jdbc-agent-all.jar` resolves Class-Path entries relative to the
// jar's own directory, so no changes are needed on the Rust/Tauri launcher side.
tasks.register('copyRuntimeLibs', Copy) {
  from configurations.runtimeClasspath
  into layout.buildDirectory.dir('libs/lib')
}

tasks.jar {
  dependsOn tasks.copyRuntimeLibs
  manifest {
    attributes(
      'Main-Class': application.mainClass.get(),
      'Class-Path': configurations.runtimeClasspath.files
        .collect { "lib/${it.name}" }
        .join(' '),
    )
  }
  archiveBaseName = 'jdbc-agent'
  archiveClassifier = 'all'
}

tasks.named('assemble') {
  dependsOn tasks.copyRuntimeLibs
}
